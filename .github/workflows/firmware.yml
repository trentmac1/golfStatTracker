name: Build tracker firmware
on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firmware
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Host tests (capture log and swing capture)
        run: sh firmware/test/host/run.sh
      - name: Build
        id: build
        run: |
          pip install -q platformio
          set -o pipefail
          pio run -d firmware 2>&1 | tee build-log.txt
          HEX=firmware/.pio/build/xiao_sense/firmware.hex
          UF2CONV=$(find ~/.platformio/packages -path '*uf2conv/uf2conv.py' | head -1)
          python3 "$UF2CONV" -f 0xADA52840 -c -o golf-tracker.uf2 "$HEX" 2>&1 | tee -a build-log.txt
          ls -l golf-tracker.uf2 | tee -a build-log.txt
      - name: Save build log
        if: always()
        run: |
          git config user.name "firmware bot"; git config user.email "actions@users.noreply.github.com"
          cp build-log.txt /tmp/build-log.txt 2>/dev/null || echo "no log" > /tmp/build-log.txt
          echo "result: ${{ steps.build.outcome }} commit ${{ github.sha }}" >> /tmp/build-log.txt
          git checkout -B firmware-log
          git rm -rq --cached . ; cp /tmp/build-log.txt build-log.txt
          git add -f build-log.txt && git commit -qm "Firmware build log" && git push -f origin firmware-log
      - uses: actions/upload-artifact@v4
        with: { name: golf-tracker-uf2, path: golf-tracker.uf2 }
      - name: Publish to the "firmware" release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view firmware >/dev/null 2>&1 || gh release create firmware --title "Tracker firmware (latest)" --notes "Latest tracker firmware built from main. Download golf-tracker.uf2, double-tap the XIAO's reset button, and drag the file onto the XIAO-SENSE drive."
          gh release upload firmware golf-tracker.uf2 --clobber
          gh release edit firmware --notes "Latest tracker firmware, built from ${GITHUB_SHA::7}. Download golf-tracker.uf2, double-tap the XIAO's reset button, and drag the file onto the XIAO-SENSE drive. See docs/tracker-build.md."
