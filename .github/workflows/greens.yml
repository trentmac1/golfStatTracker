name: Refresh course map data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  osm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch green outlines from OpenStreetMap
        run: python analysis/greens/update_osm.py
      - name: Commit changes
        run: |
          git config user.name "course-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add webapp/data/osm
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh OpenStreetMap course data"
          git push
