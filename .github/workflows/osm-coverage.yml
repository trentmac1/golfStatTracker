name: OSM coverage
on: workflow_dispatch
permissions:
  contents: write
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python analysis/probe/osm_coverage.py > coverage-log.txt 2>&1 || true
      - run: |
          git config user.name "probe bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B osm-coverage
          git rm -rq --cached . ; git add -f osm-coverage.md coverage-log.txt; git commit -qm "OSM coverage" && git push -f origin osm-coverage
