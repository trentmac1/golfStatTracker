name: Check course server
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          S=$(grep -o "COURSE_SERVER = '[^']*'" webapp/js/config.js | cut -d"'" -f2)
          O=https://trentmac1.github.io
          {
            echo "server: $S"
            echo "--- health"; curl -sS -m 20 -i "$S/api/health" -H "Origin: $O" | grep -iE "^HTTP|access-control-allow-origin|^\{" || echo "FAILED"
            echo "--- preflight"; curl -sS -m 20 -i -X OPTIONS "$S/api/courses" -H "Origin: $O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" | grep -iE "^HTTP|access-control-allow-(origin|methods|headers)" || echo "FAILED"
            echo "--- list"; curl -sS -m 20 "$S/api/courses" -H "Origin: $O" | head -c 300; echo
          } > server-check.txt 2>&1
          git config user.name "probe bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -B server-check
          git rm -rq --cached . ; git add -f server-check.txt && git commit -qm "Server check" && git push -f origin server-check
