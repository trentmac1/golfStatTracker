; Golf tracker firmware: XIAO nRF52840 Sense + L76K GNSS board.
; Seeed's PlatformIO platform, non-mbed (Adafruit Bluefruit) core, which is
; the one Seeed recommends for BLE and low power. Pinned to a commit so builds
; are reproducible.
[env:xiao_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#024c190fef52da02ebae5c09d47c101e0ff0762a
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
monitor_speed = 115200
build_flags =
  -DFW_MAJOR=0
  -DFW_MINOR=3
  -DFW_PATCH=0
; Raw access to the 2 MB QSPI flash (capture log). Only Adafruit_SPIFlashBase
; is used; SdFat is a dependency of the library's other files.
lib_deps =
  adafruit/Adafruit SPIFlash@5.1.1
  adafruit/SdFat - Adafruit Fork@^2.2.3
